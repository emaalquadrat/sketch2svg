name: Tests

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instal·la potrace
        run: sudo apt-get update && sudo apt-get install -y potrace
      - name: Instal·la dependències
        run: pip install -r requirements.txt pytest
      - name: Passa els tests
        run: pytest -q
